name: Build Teacher Nelly Academy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o *.zip -d extracted
          find extracted -name gradlew -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find extracted -name gradlew -type f | head -1)")
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Nelly-Academy-APK
          path: '**/build/outputs/apk/debug/*.apk'
