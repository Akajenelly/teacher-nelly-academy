
name: Build Teacher Nelly Academy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              unzip -o "$zip" -d extracted
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          SETTINGS_PATH=$(find extracted \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -type f | head -1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: No Android Gradle project found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Nelly-Academy-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
